services:
  subtitles-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subtitles-web
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    ports:
      - "${PORT:-8585}:8080"
    volumes:
      # Configuración y persistencia de base de datos / logs
      - ./.env:/app/.env
      - ./storage:/app/storage
      - ./app:/app/app
      - ./resources:/app/resources
      - ./public:/app/public
      - ./config:/app/config
      - ./scripts:/app/scripts
      - ./bin:/app/bin
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh
      - ./docker-entrypoint.sh:/docker-entrypoint.sh

      # Montaje de bibliotecas multimedia (Lectura y Escritura para subtítulos .srt)
      - /mnt/disk2tb/data/media/movies:/mnt/disk2tb/data/media/movies:rw
      - /mnt/disk2tb/data/media/tv:/mnt/disk2tb/data/media/tv:rw

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      - TZ=America/Tijuana
      - APP_TIMEZONE=America/Tijuana
      - TRANSLATION_TIMEOUT_SECONDS=300
